name: Stock Pulse Monitor

on:
  schedule:
    # Every 10 minutes. NOTE: GitHub's cron has real-world delays of 5-20 min
    # under load, so effective polling is ~10-30 min. Acceptable for v1.
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  # contents:write so the workflow can commit the updated tracking ledger
  # (state/seen.json, state/alerts.jsonl, state/scorecard.jsonl,
  # state/digest_state.json) back to the repo for a durable audit trail.
  contents: write

# Prevent overlapping runs (in case a slow run is still going when next fires).
# This also serializes commits, which avoids push races on state/.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need a real ref so we can commit + push back.
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SEC EDGAR requires a User-Agent with real contact info (email).
          # Set this secret to e.g. "Your Name your-email@example.com".
          USER_AGENT: ${{ secrets.USER_AGENT }}
          # Minimum LLM impact score (1-10) for an alert to fire. Combined
          # with the buy/sell-only gate, this is the relevance filter.
          # 7 = "meaningful, 1-3% move likely"; 8 = "significant, 3-7% move
          # or sector-wide effect". Raised to 8 after pipeline verification
          # to keep the notification volume tight.
          ALERT_THRESHOLD: "8"
        run: python monitor.py

      - name: Commit tracking ledger
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the state files that actually exist this run.
          # The previous version used a single multi-path
          # `git add ... 2>/dev/null || true`, but when any pathspec was
          # missing git left NOTHING staged — so seen.json never got
          # committed and every run looked like a "first run". The
          # per-file check below is unambiguous and logs what was staged.
          for f in state/seen.json \
                   state/alerts.jsonl \
                   state/scorecard.jsonl \
                   state/digest_state.json; do
            if [ -f "$f" ]; then
              echo "Staging $f"
              git add "$f"
            else
              echo "Skipping $f (does not exist this run)"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update tracking ledger [skip ci]"
          # Pull-rebase to absorb any state changes from a concurrent or
          # manually-triggered run, then push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
