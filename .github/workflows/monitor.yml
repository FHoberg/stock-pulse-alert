name: Stock Pulse Monitor

on:
  schedule:
    # Every 10 minutes. NOTE: GitHub's cron has real-world delays of 5-20 min
    # under load, so effective polling is ~10-30 min. Acceptable for v1.
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: read

# Prevent overlapping runs (in case a slow run is still going when next fires)
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Restore the most recent state cache (seen.json).
      # restore-keys lets us match by prefix even though we always save under a
      # unique run-id key (caches are immutable in GitHub Actions).
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state
          key: stock-pulse-state-${{ github.run_id }}
          restore-keys: |
            stock-pulse-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SEC EDGAR requires a User-Agent with real contact info (email).
          # Set this secret to e.g. "Your Name your-email@example.com".
          USER_AGENT: ${{ secrets.USER_AGENT }}
          ALERT_THRESHOLD: "7"
        run: python monitor.py

      # Always save a fresh cache entry, even on failure, so state isn't lost.
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: stock-pulse-state-${{ github.run_id }}
